
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: uplift-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/data:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: uplift-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped
